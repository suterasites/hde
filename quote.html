<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote | Hoad Drainage & Excavations</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://hoaddrainage.com.au/contact.html">
<meta http-equiv="refresh" content="0; url=contact.html?type=quote">
<script>window.location.replace('contact.html?type=quote');</script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-761TQKBV4P"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-761TQKBV4P');
  </script>
  <!-- Sutera lead events (GA4) -->
  <script>/* SUTERA_LEAD_EVENTS */
  (function(){
    function ev(n, p){ if (typeof window.gtag === 'function') { window.gtag('event', n, Object.assign({transport_type:'beacon'}, p||{})); } }
    document.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a[href^="tel:"]') : null;
      if (a) ev('click_to_call', { link_url: a.getAttribute('href') });
    }, true);
    document.addEventListener('submit', function(e){
      var f = e.target;
      if (!f || f.tagName !== 'FORM' || f.hasAttribute('data-no-lead')) return;
      var action = f.getAttribute('action') || '';
      var isLead = /formspree/i.test(action) || f.querySelector('input[type="email"], input[type="tel"], textarea');
      if (isLead) ev('generate_lead', { form_id: f.id || f.getAttribute('name') || 'contact' });
    }, true);
  })();
  </script>
</head>
<body>
<p>Quotes have moved to our <a href="contact.html?type=quote">contact page</a>. Redirecting you now.</p>
</body>
</html>
